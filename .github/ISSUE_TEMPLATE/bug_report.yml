name: Bug report
description: Report a bug in the extension
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Run "DeepSeek Harness: Start Chat"
        2. Send a prompt
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
  - type: input
    id: env
    attributes:
      label: Environment
      description: VS Code version, OS, Node version, and deepseek-harness version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log / error output
      description: Paste relevant lines from the "Server log" panel or the extension host output.
      render: shell
